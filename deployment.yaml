apiVersion: apps/v1
kind: Deployment
metadata:
  name: road-hazard-portal
  labels:
    app: hazard-portal
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hazard-portal
  template:
    metadata:
      labels:
        app: hazard-portal
    spec:
      containers:
      - name: portal-app
        image: lokeshbudati/road-hazard-portal:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        # Liveness probe to check container health status
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: road-hazard-service
spec:
  type: NodePort
  selector:
    app: hazard-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30010
